[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsr"
version = "0.1.0"
description = "Qiskit self-repair evaluation harness (GPT-OSS-120B via Groq on Qiskit HumanEval)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
